name: Refresh Triunfobet (IP residencial)

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-triunfobet
  cancel-in-progress: false

jobs:
  triunfobet:
    # Runner instalado en el PC del usuario: Altenar devuelve 403 a IPs de
    # datacenter, así que la captura debe correr desde una IP residencial.
    # El navegador se lanza en modo --headed dentro de la sesión interactiva.
    runs-on: [self-hosted, windows, residential]
    timeout-minutes: 30
    permissions:
      contents: write
    # El widget público de Altenar muestra cuotas sin login ni sesión.
    env:
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Sin cache: el post-step de tar.exe falla en este runner Windows.

      - name: Instalar dependencias
        run: npm ci

      - name: Asegurar Chromium de Playwright
        run: npx playwright install chromium

      - name: Capturar Triunfobet (widget público, navegador visible)
        shell: powershell
        run: |
          # El widget a veces no termina de cargar en 30 s. Reintentamos una vez
          # antes de dar el job por fallido, para no inyectar una semilla vieja.
          $ok = $false
          for ($intento = 1; $intento -le 3; $intento++) {
            # El widget público no requiere sesión; repetimos si no renderiza.
            Write-Host "CAPTURA_INTENTO=$intento"
            $salida = node scripts/triunfobet-capture.mjs --write --headed --wait 30000 2>&1
            $salida | ForEach-Object { Write-Host $_ }
            if (("$salida" -join "`n") -match "COTIZACIONES_DETECTADAS=[1-9]") {
              $ok = $true
              break
            }
            Write-Host "SIN_COTIZACIONES en el intento $intento; reintentando..."
          }
          if (-not $ok) { Write-Host "ERROR: la captura no obtuvo cotizaciones."; exit 1 }

      - name: Inyectar cuotas en la web desplegada
        if: env.SITE_URL != ''
        shell: powershell
        run: |
          node scripts/ingest-triunfobet.mjs scripts/triunfobet-quotes.json --url "$env:SITE_URL/api/ingest/triunfobet"
          if ($LASTEXITCODE -ne 0) { Write-Host "WARN: no se pudo inyectar Triunfobet (semilla fuera de ventana VET)" }

      - name: Guardar semilla actualizada
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/triunfobet-quotes.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "Sin cambios en la semilla de Triunfobet."; exit 0 }
          $stamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mmZ")
          # Commit ANTES del rebase: git pull --rebase rechaza un indice con cambios.
          git commit -m "chore(triunfobet): actualizar cuotas $stamp"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          for ($intento = 1; $intento -le 3; $intento++) {
            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) { exit 1 }
            git push origin main
            if ($LASTEXITCODE -eq 0) { Write-Host "Semilla de Triunfobet publicada."; exit 0 }
            Write-Host "Reintento de push $intento..."
            Start-Sleep -Seconds 5
          }
          Write-Host "ERROR: no se pudo publicar la semilla de Triunfobet."
          exit 1

