name: Refresh Triunfobet (IP residencial)

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-triunfobet
  cancel-in-progress: false

jobs:
  triunfobet:
    # Runner instalado en el PC del usuario: Altenar devuelve 403 a IPs de
    # datacenter, así que la captura debe correr desde una IP residencial.
    # El navegador se lanza en modo --headed dentro de la sesión interactiva.
    runs-on: [self-hosted, windows, residential]
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
      SITE_URL: ${{ secrets.SITE_URL }}
      TB_USER: ${{ secrets.TB_USER }}
      TB_PASS: ${{ secrets.TB_PASS }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Asegurar Chromium de Playwright
        run: npx playwright install chromium

      - name: Capturar Triunfobet (navegador visible)
        continue-on-error: true
        run: node scripts/triunfobet-capture.mjs --write --headed --wait 30000

      - name: Inyectar cuotas en la web desplegada
        if: env.SITE_URL != ''
        shell: bash
        run: |
          node scripts/ingest-triunfobet.mjs scripts/triunfobet-quotes.json \
            --url "$SITE_URL/api/ingest/triunfobet" \
            || echo "WARN: no se pudo inyectar Triunfobet (semilla fuera de ventana VET)"

      - name: Guardar semilla actualizada
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/triunfobet-quotes.json
          if git diff --cached --quiet; then
            echo "Sin cambios en la semilla de Triunfobet."
            exit 0
          fi
          for intento in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git diff --cached --quiet; then
              echo "Sin cambios tras el rebase."
              exit 0
            fi
            git commit -m "chore(triunfobet): actualizar cuotas $(date -u +%Y-%m-%dT%H:%MZ)" || exit 1
            if git push origin main; then
              echo "Semilla de Triunfobet publicada."
              exit 0
            fi
            echo "Reintento de push $intento..."
            sleep 5
          done
          echo "ERROR: no se pudo publicar la semilla de Triunfobet."
          exit 1
