name: Deploy a Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Tests de fechas
        run: npm run test:dates

      - name: Tests de modelo
        run: npm run test:model

      - name: Tests de fusión y circuit breaker
        run: npm run test:fusion

      - name: Tests ETL
        run: npm run test:etl

      - name: Preparar secrets del Worker
        env:
          ALLSPORTSAPI_KEY: ${{ secrets.ALLSPORTSAPI_KEY }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          SPORTMONKS_KEY: ${{ secrets.SPORTMONKS_KEY }}
          THERUNDOWN_API_KEY: ${{ secrets.THERUNDOWN_API_KEY }}
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          node -e '
          const fs = require("fs");
          const names = [
            "ALLSPORTSAPI_KEY",
            "APISPORTS_KEY",
            "FOOTBALL_DATA_API_KEY",
            "SPORTMONKS_KEY",
            "THERUNDOWN_API_KEY",
            "THESPORTSDB_KEY",
            "SITE_URL",
          ];
          const secrets = {};
          for (const name of names) {
            const value = process.env[name];
            // La key pública "123" de TheSportsDB dispara 429 y dispara demasiado
            // trabajo por request en el Worker; el propio adapter la ignora.
            if (value && !(name === "THESPORTSDB_KEY" && value === "123")) {
              secrets[name] = value;
            }
          }
          fs.writeFileSync(".worker-secrets.json", JSON.stringify(secrets));
          console.log(`secrets preparados: ${Object.keys(secrets).length}`);
          '

      - name: Quitar secret obsoleto de TheSportsDB
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}
        run: |
          if [ -z "$THESPORTSDB_KEY" ] || [ "$THESPORTSDB_KEY" = "123" ]; then
            npx cf workers secrets delete --worker betstatspro THESPORTSDB_KEY --force || true
          fi

      - name: Compilar y publicar Worker
        run: npx cf deploy --secrets-file .worker-secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: true
