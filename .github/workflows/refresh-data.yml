name: Refresh automático de cuotas y The Analyst

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
      SITE_URL: ${{ secrets.SITE_URL }}
      # Royal usa Turnstile: se reutiliza una sesión real exportada desde Chrome.
      ROYAL_STORAGE_STATE: ${{ secrets.ROYAL_STORAGE_STATE }}
      BOOKMAKER_URL: ${{ secrets.BOOKMAKER_URL }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Capturar partidos de Flashscore (hoy y mañana VET)
        continue-on-error: true
        run: node scripts/flashscore-scrape.mjs

      - name: Capturar Apuestas Royal con sesión exportada
        if: env.ROYAL_STORAGE_STATE != ''
        continue-on-error: true
        run: node scripts/apuestas-royal-capture.mjs --write

      - name: Descargar The Analyst y actualizar su semilla
        continue-on-error: true
        run: |
          node scripts/the-analyst-scrape.mjs scripts/the-analyst-payload.json 20 prediction
          node -e "const p=JSON.parse(require('fs').readFileSync('scripts/the-analyst-payload.json','utf8')); if(!p.registros || p.registros.length===0) process.exit(1)"
          cp scripts/the-analyst-payload.json scripts/the-analyst-seed.json

      - name: Validar payloads generados
        run: |
          node scripts/validate-ingest-payload.mjs --allow-stale scripts/flashscore-payload.json scripts/flashscore-payload-manana.json scripts/apuestas-royal-quotes.json scripts/the-analyst-seed.json || echo "WARN: validacion con observaciones"
      - name: Inyectar datos en la web desplegada
        if: env.SITE_URL != ''
        run: |
          node scripts/ingest-payload.mjs scripts/flashscore-payload.json --url "$SITE_URL/api/ingest" || echo "WARN: no se pudo inyectar Flashscore hoy"
          node scripts/ingest-payload.mjs scripts/flashscore-payload-manana.json --url "$SITE_URL/api/ingest" || echo "WARN: no se pudo inyectar Flashscore mañana"
          node scripts/ingest-apuestas-royal.mjs --url "$SITE_URL/api/ingest/apuestas-royal" || echo "WARN: no se pudo inyectar Apuestas Royal"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $INGEST_TOKEN" \
            "$SITE_URL/api/ingest/the-analyst/refresh" || echo "WARN: no se pudo refrescar The Analyst"

      - name: Guardar semillas actualizadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/flashscore-payload.json scripts/flashscore-payload-manana.json \
            scripts/apuestas-royal-quotes.json scripts/the-analyst-seed.json
          if git diff --cached --quiet; then
            echo "Sin cambios en las semillas."
          else
            git commit -m "chore(refresh): actualizar cuotas e insights $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi


